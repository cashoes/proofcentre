  - name: "Dr. Chengliang Yang"
    role: "Research Associate"
    mini_bio: "Specializes in Ex Vivo Lung Perfusion (EVLP) and multi-omic profiling to develop non-invasive biomarkers for heart and lung transplantation and Long COVID."
    bio: |
      Dr. Chengliang Yang, MD, MSc, is a Transplant Scientist and Ex Vivo Lung Perfusion (EVLP) Specialist at the PROOF Centre and the Centre for Heart Lung Innovation (HLI), UBC. Working at the intersection of organ transplantation, immunology, and multi-omics, he develops and validates non-invasive blood biomarkers to improve diagnosis and risk assessment in heart and lung transplantation, as well as Long COVID.

      He completed his postdoctoral fellowship and EVLP specialist training at the Latner Thoracic Surgery Research Laboratories and Toronto Lung Transplant Program (UHN/University of Toronto). Dr. Yang is also an active Senior Collaborator in the Global Burden of Disease (GBD) network.
    original_bio: >-
      Chengliang Yang, MD, MSc, is a Transplant Scientist and Ex Vivo Lung Perfusion (EVLP) Specialist working at the interface of organ transplantation, immunology, and multi-omics. His work is driven by a passion for evidence generation, multidisciplinary collaboration, and improving patient outcomes. He focuses on leveraging multi-omics approaches to develop and validate noninvasive biomarkers that can improve diagnosis, refine risk assessment, and inform clinical decision-making in heart and lung transplantation. His research also extends to biomarker discovery and translational studies in post-COVID-19 condition (long COVID). Dr. Yang is an active Senior Collaborator in the Global Burden of Disease (GBD) Collaborator Network, contributing to studies of global circulatory and respiratory health. Through this work, he supports the generation of timely, policy-relevant, and scientifically rigorous evidence to strengthen health systems and improve population health worldwide. Dr. Yang completed his postdoctoral fellowship and trained as an EVLP Specialist at the Latner Thoracic Surgery Research Laboratories and the Toronto Lung Transplant Program at University Health Network, University of Toronto. He is currently a Research Associate at the Prevention of Organ Failure (PROOF) Centre and the Centre for Heart Lung Innovation (HLI) at St. Paul’s Hospital, University of British Columbia. Personal note: Outside of work, he enjoys hiking, backpacking, trail running, and swimming.
