  - name: "Estefanía Espín"
    role: "PhD Candidate"
    mini_bio: "Investigates Long COVID heterogeneity by bridging qualitative patient and clinician insights with high-dimensional transcriptomic and metabolomic biomarker discovery and clinical validation."
    bio: |
      Estefanía Espín Armas is a PhD Candidate in Experimental Medicine at the University of British Columbia under Dr. Scott Tebbutt at the Centre for Heart Lung Innovation. Her doctoral research addresses the clinical and molecular heterogeneity of Long COVID, combining qualitative insights from patients and healthcare professionals with transcriptomic and metabolomic biomarker discovery.

      Bringing over a decade of biomedical research experience, she previously served for five years as a university lecturer in Medical Genetics and Cellular Biology in Ecuador. She holds a Master’s in Biomedical Biotechnology with distinction from the Polytechnic University of Valencia.
    original_bio: >-
      Estefanía Espín Armas is a PhD Candidate in Experimental Medicine at the University of British Columbia, conducting her research under the supervision of Dr. Scott J. Tebbutt at the Centre for Heart Lung Innovation at St. Paul’s Hospital. She holds a Bachelor’s degree in Biotechnology from the University of the Armed Forces–ESPE, Ecuador, and a Master’s degree in Biomedical Biotechnology, completed with distinction at the Polytechnic University of Valencia, Spain. Estefanía has over 10 years of experience in biomedical and health research, including academic, public health, and laboratory research. From 2016 to 2021, she was a Lecturer in the Faculty of Medicine at the University of the Americas in Ecuador, where she taught Medical Genetics and Molecular and Cellular Biology. Her doctoral research focuses on developing biomarkers to better understand the molecular and clinical heterogeneity of Long COVID and improve its diagnosis and characterization. Her interdisciplinary research combines scoping and qualitative research, patient and healthcare professional perspectives, and transcriptomic and metabolomic approaches to biomarker discovery and validation. Through her research training at the PROOF Centre and the University of British Columbia, she is further developing expertise in bioinformatics, statistical analysis, and data-driven approaches to biomarker development.
    orcid: "0000-0002-7926-0010"
