  - name: "Casey Shannon"
    role: "Director of Data Science"
    mini_bio: "Leads computational biology and data science at the PROOF Centre, developing multi-omic pipelines to translate complex molecular data into non-invasive clinical biomarkers."
    bio: |
      Casey Shannon is Director of Data Science at the PROOF Centre of Excellence. Working at the interface of computer science, statistics, and biology, he develops computational pipelines and statistical learning methods to interpret high-dimensional multi-omic data from clinical cohorts. He was the computational lead on HEARTBiT, a blood-based gene expression test designed to detect acute cellular rejection in heart transplant recipients.

      Interested in open and reproducible science, he co-developed the DIABLO multi-omics integration framework in mixOmics and open-source tools for in silico cell-type deconvolution. His collaborative research spans international partnerships, including the Expanded Program on Immunization Consortium (EPIC) examining infant immune development and vaccine response, the IMPACC study investigating COVID-19 trajectories, and ongoing biomarker studies in heart and lung disease. Casey completed Bachelor’s degrees in Cell Physiology & Genetics as well as Computer Science at the University of British Columbia.
    original_bio: >-
      Casey Shannon is a data scientist and computational biologist. At the PROOF Centre of Excellence, he uses high dimensional gene, protein, and metabolite data to derive clinically useful diagnostic or prognostic tests. This involves the application of machine learning approaches to identify informative features from the vast amounts of data generated by high throughput omics platforms. Prior to joining PROOF, Casey’s research interests included the study of spinal cord injury in rodent models, particularly the use of adult skin-derived stem-cells in spinal cord injury repair. This work lead to publications in The Journal of Neurotrauma and The Journal of Neuroscience. Casey holds Bachelor’s degrees in Cell Physiology and Genetics, as well as Computer Science, from the University of British Columbia.
    orcid: "0000-0002-5687-3156"
